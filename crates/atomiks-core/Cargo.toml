[package]
name                   = "atomiks-core"
description            = "the typed atomic of atomiks, the values it holds, and the orderings and primitives under it."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[package.metadata.cargo-shear]
ignored-paths = ["tests/compile_fail/**/*.rs", "tests/compile_pass/*.rs"]

[features]
default = []
loom    = ["dep:loom", "dep:tracing", "dep:tracing-subscriber"]

[lints]
workspace = true

[dev-dependencies]
# external
proptest = { workspace = true }
trybuild = { workspace = true }

[build-dependencies]
# external
cfg_aliases = { workspace = true }

[target.'cfg(loom)'.dependencies]
# external
loom               = { workspace = true, optional = true }
tracing            = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

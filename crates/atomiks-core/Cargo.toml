[package]
name                   = "atomiks-core"
description            = "the typed atomic of atomiks, the values it holds, and the orderings and primitives under it."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[package.metadata.cargo-shear]
ignored-paths = ["tests/compile_fail/**/*.rs", "tests/compile_pass/*.rs"]

[package.metadata.docs.rs]
features = ["serde"]

[features]
default = []
loom    = ["dep:loom", "dep:tracing", "dep:tracing-subscriber"]
serde   = ["dep:serde_core"]

[lints]
workspace = true

[dependencies]
# external
serde_core = { workspace = true, optional = true }

[dev-dependencies]
# external
proptest   = { workspace = true }
serde_json = { workspace = true }
trybuild   = { workspace = true }

[build-dependencies]
# external
cfg_aliases = { workspace = true }

[target.'cfg(loom)'.dependencies]
# external
loom               = { workspace = true, optional = true }
tracing            = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[package]
name                   = "atomiks"
description            = "typed atomics for any value that fits one atomic word."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[package.metadata.cargo-shear]
ignored-paths = ["tests/compile_fail/*.rs", "tests/compile_pass/*.rs"]

[package.metadata.docs.rs]
features = ["bytemuck", "derive", "serde", "zerocopy-08"]

[features]
default     = []
bytemuck    = ["atomiks-core/bytemuck"]
derive      = ["dep:atomiks-derive"]
loom        = ["atomiks-core/loom"]
serde       = ["atomiks-core/serde"]
zerocopy-08 = ["atomiks-core/zerocopy-08"]

[lints]
workspace = true

[dependencies]
# internal
atomiks-core   = { workspace = true }
atomiks-derive = { path = "macros/derive", version = "=0.1.0", optional = true }

[dev-dependencies]
# external
bytemuck   = { workspace = true, features = ["derive"] }
proptest   = { workspace = true }
serde      = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
trybuild   = { workspace = true }
zerocopy   = { workspace = true }

[target.'cfg(any())'.dependencies]
# internal
atomiks-derive = { path = "macros/derive", version = "=0.1.0" }

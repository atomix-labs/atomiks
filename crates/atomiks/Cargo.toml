[package]
name                   = "atomiks"
description            = "typed atomics for any value that fits one atomic word."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
authors.workspace      = true
repository.workspace   = true

[package.metadata.cargo-shear]
ignored-paths = ["tests/compile_fail/*.rs", "tests/compile_pass/*.rs"]

[package.metadata.docs.rs]
features = ["derive", "serde"]

[features]
default = []
derive  = ["dep:atomiks-derive"]
loom    = ["atomiks-core/loom"]
serde   = ["atomiks-core/serde"]

[lints]
workspace = true

[dependencies]
# internal
atomiks-core   = { workspace = true }
atomiks-derive = { path = "macros/derive", version = "=0.1.0", optional = true }

[dev-dependencies]
# external
proptest   = { workspace = true }
serde      = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
trybuild   = { workspace = true }

[target.'cfg(any())'.dependencies]
# internal
atomiks-derive = { path = "macros/derive", version = "=0.1.0" }

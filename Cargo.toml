[workspace]
members  = ["crates/*"]
resolver = "3"

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.98"
license      = "MIT OR Apache-2.0"
authors      = ["Atomix Labs"]
repository   = "https://github.com/atomix-labs/atomiks"

[workspace.dependencies]
# external
cfg_aliases        = { version = "0.2.2" }
loom               = { version = "0.7" }
proptest           = { version = "1.11", default-features = false, features = ["std"] }
tracing            = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt"] }
trybuild           = { version = "1.0" }
# internal
atomiks-core = { path = "crates/atomiks-core", version = "0.1.0", default-features = false }

[workspace.lints]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn        = "deny"
unused_must_use               = "deny"
unknown_lints                 = "deny"
unfulfilled_lint_expectations = "deny"
rust_2018_idioms              = { level = "deny", priority = -1 }
unexpected_cfgs               = { level = "deny", check-cfg = ["cfg(loom)"] }
unused_qualifications         = "allow"
meta_variable_misuse          = "deny"
macro_use_extern_crate        = "deny"
# The house policy, `strict`: no unsafe code, every item documented and debuggable, nothing
# public that the crate does not export, and no unused code or lifetimes.
unsafe_code                   = "deny"
missing_docs                  = "deny"
missing_debug_implementations = "deny"
unreachable_pub               = "deny"
unused                        = { level = "deny", priority = -1 }
single_use_lifetimes          = "deny"
unused_lifetimes              = "deny"
variant_size_differences      = "deny"

[workspace.lints.cargo]
non_kebab_case_bins = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links       = "deny"
private_intra_doc_links      = "deny"
unescaped_backticks          = "deny"
invalid_html_tags            = "deny"
bare_urls                    = "deny"
redundant_explicit_links     = "deny"
invalid_rust_codeblocks      = "deny"
invalid_codeblock_attributes = "deny"

[workspace.lints.clippy]
all              = { level = "deny", priority = -1 }
pedantic         = { level = "deny", priority = -1 }
module_inception = "allow"
empty_enums      = "allow"
# The house policy, `strict`: the nursery, and the restriction lints.
nursery                           = { level = "deny", priority = -1 }
redundant_pub_crate               = "allow"
self_named_module_files           = "deny"
allow_attributes                  = "deny"
allow_attributes_without_reason   = "deny"
unwrap_used                       = "deny"
expect_used                       = "deny"
undocumented_unsafe_blocks        = "deny"
multiple_unsafe_ops_per_block     = "deny"
unnecessary_safety_comment        = "deny"
unnecessary_safety_doc            = "deny"
missing_docs_in_private_items     = "deny"
panic                             = "deny"
panic_in_result_fn                = "deny"
todo                              = "deny"
unimplemented                     = "deny"
unreachable                       = "deny"
error_impl_error                  = "deny"
map_err_ignore                    = "deny"
indexing_slicing                  = "deny"
arithmetic_side_effects           = "deny"
mem_forget                        = "deny"
dbg_macro                         = "deny"
float_cmp                         = "deny"
lossy_float_literal               = "deny"
as_conversions                    = "deny"
absolute_paths                    = "deny"
wildcard_imports                  = "deny"
print_stdout                      = "deny"
print_stderr                      = "deny"
exit                              = "deny"
await_holding_lock                = "deny"
std_instead_of_core               = "deny"
std_instead_of_alloc              = "deny"
clone_on_ref_ptr                  = "deny"
unwrap_in_result                  = "deny"
get_unwrap                        = "deny"
string_slice                      = "deny"
wildcard_enum_match_arm           = "deny"
unused_result_ok                  = "deny"
let_underscore_must_use           = "deny"
mixed_read_write_in_expression    = "deny"
suspicious_xor_used_as_pow        = "deny"
same_name_method                  = "deny"
redundant_type_annotations        = "deny"
unnecessary_self_imports          = "deny"
str_to_string                     = "deny"
empty_structs_with_brackets       = "deny"
empty_enum_variants_with_brackets = "deny"
create_dir                        = "deny"
verbose_file_reads                = "deny"
filetype_is_file                  = "deny"
mutex_atomic                      = "deny"
mutex_integer                     = "deny"
rc_buffer                         = "deny"
rc_mutex                          = "deny"
semicolon_inside_block            = "deny"
tests_outside_test_module         = "deny"
unseparated_literal_suffix        = "deny"
pub_without_shorthand             = "deny"
missing_assert_message            = "deny"
impl_trait_in_params              = "deny"

[profile.release]
opt-level        = 3
lto              = "fat"
codegen-units    = 1
debug            = false
debug-assertions = false
overflow-checks  = false
panic            = "abort"
strip            = false
incremental      = false
rpath            = false

[profile.bench]
inherits      = "release"
lto           = "fat"
codegen-units = 1

[profile.dev]
opt-level        = 0
lto              = false
codegen-units    = 256
debug            = true
debug-assertions = true
overflow-checks  = true
panic            = "abort"
strip            = false
incremental      = true
rpath            = false

[profile.dev.package."*"]
opt-level = 3

[profile.test]
inherits      = "dev"
codegen-units = 16

[profile.profiling]
inherits        = "release"
debug           = "full"
strip           = "none"
split-debuginfo = "packed"

[profile.release-fast]
inherits      = "release"
lto           = "thin"
codegen-units = 16
incremental   = true

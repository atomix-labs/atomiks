[profile.ci]
fail-fast      = false
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"

# trybuild builds each crate's fixtures under one `target/tests/trybuild/`: one suite at a time.
# atomiks-core's suite is its test `trybuild`; the facade's, the module `trybuild` of its test
# `compiled`.
[test-groups]
trybuild = { max-threads = 1 }

[[profile.default.overrides]]
filter     = "binary(trybuild) | (binary(compiled) & test(/^trybuild::/))"
test-group = "trybuild"
